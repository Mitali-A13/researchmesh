name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: thinkmesh
          POSTGRES_USER: thinkmesh
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thinkmesh -d thinkmesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://thinkmesh:test_password@localhost:5432/thinkmesh
      MISTRAL_API_KEY: test-key
      TAVILY_API_KEY: test-key
      SECRET_KEY: test-secret-key-for-ci
      VERIFY_WITH_LLM: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run PostgreSQL migrations
        run: alembic upgrade head

      - name: Check PostgreSQL schema
        run: alembic check

      - name: Run tests
        run: |
          DATABASE_URL=sqlite:///./ci_test.db pytest -q
